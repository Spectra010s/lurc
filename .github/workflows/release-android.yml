name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LURC_KEYSTORE_PATH: android/app/lurc-release.jks
      LURC_KEYSTORE_PASSWORD: ${{ secrets.LURC_KEYSTORE_PASSWORD }}
      LURC_KEY_ALIAS: ${{ secrets.LURC_KEY_ALIAS }}
      LURC_KEY_PASSWORD: ${{ secrets.LURC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore release keystore
        env:
          LURC_KEYSTORE_BASE64: ${{ secrets.LURC_KEYSTORE_BASE64 }}
        run: |
          test -n "$LURC_KEYSTORE_BASE64"
          printf '%s' "$LURC_KEYSTORE_BASE64" | base64 --decode > "$LURC_KEYSTORE_PATH"

      - name: Verify signing inputs
        run: |
          test -s "$LURC_KEYSTORE_PATH"
          test -n "$LURC_KEYSTORE_PASSWORD"
          test -n "$LURC_KEY_ALIAS"
          test -n "$LURC_KEY_PASSWORD"

      - name: Build universal release APK
        run: |
          flutter build apk --release
          mkdir -p build/release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk build/release-artifacts/lurc-universal.apk

      - name: Build split release APKs
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/release-artifacts/lurc-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/release-artifacts/lurc-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/release-artifacts/lurc-x86_64.apk

      - name: Build release app bundle
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab build/release-artifacts/lurc-release.aab

      - name: Record artifact sizes and checksums
        run: |
          cd build/release-artifacts
          ls -lh
          sha256sum * > SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: lurc-android-release
          path: build/release-artifacts/
          if-no-files-found: error
