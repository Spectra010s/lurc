name: Android build

on:
  pull_request:
    branches:
      - main
      - ci/android-build
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Lurc dependencies
        run: flutter pub get

      - name: Build Lurc debug APK
        run: flutter build apk --debug

      - name: Rename Lurc debug APK
        run: mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/lurc-app-debug.apk

      - name: Upload Lurc debug APK
        uses: actions/upload-artifact@v6
        with:
          name: lurc-app-debug
          path: build/app/outputs/flutter-apk/lurc-app-debug.apk
          if-no-files-found: error

      - name: Install control dependencies
        working-directory: tests/control
        run: flutter pub get

      - name: Build control debug APK
        working-directory: tests/control
        run: flutter build apk --debug

      - name: Rename control debug APK
        run: mv tests/control/build/app/outputs/flutter-apk/app-debug.apk tests/control/build/app/outputs/flutter-apk/lurc-control-debug.apk

      - name: Upload control debug APK
        uses: actions/upload-artifact@v6
        with:
          name: lurc-control-debug
          path: tests/control/build/app/outputs/flutter-apk/lurc-control-debug.apk
          if-no-files-found: error
