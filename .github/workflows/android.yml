name: Android build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename debug APK
        run: mv build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/lurc-app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: lurc-app-debug
          path: build/app/outputs/flutter-apk/lurc-app-debug.apk
          if-no-files-found: error
